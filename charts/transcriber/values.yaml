---
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/michael-c-buckley/transcriber
  # Set this to an immutable Git SHA tag for deployments. An empty value uses
  # Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

imagePullSecrets: []

schedule: "5 * * * *"
timeZone: America/New_York
concurrencyPolicy: Forbid
startingDeadlineSeconds: 900
successfulJobsHistoryLimit: 2
failedJobsHistoryLimit: 5
suspend: false

job:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400

restartPolicy: Never

sources:
  entries: []
  existingConfigMap: ""
  existingConfigMapKey: sources.txt

transcriber:
  requestDelay: 1
  videoDelay: 10
  extraEnv: []

git:
  enabled: false
  remote: ""
  branch: main
  commitMessage: Transcriber output
  authorName: Transcriber
  authorEmail: transcriber@localhost
  username: x-access-token
  existingSecret: ""
  tokenKey: token

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}
  mountPath: /var/lib/transcriber
  stateSubPath: state
  outputSubPath: output

tmp:
  enabled: true
  sizeLimit: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}
cronJobAnnotations: {}
cronJobLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []
